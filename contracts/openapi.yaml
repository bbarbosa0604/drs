      required: [label, percentage, totalChecks, passedChecks]
      properties:
        label:
          type: string
          enum: ["Percentual de preenchimento do Escopometro"]
        percentage:
          type: integer
          minimum: 0
          maximum: 100
        totalChecks:
          type: integer
        passedChecks:
          type: integer

