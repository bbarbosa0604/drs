openapi: 3.1.0
info:
  title: DRS API Contract
  version: 0.1.0
  description: >
    Contrato central para alinhamento entre next-js (front-end) e backend (NestJS)
    do DSR - Daryus Resilient Services. Cobre, nesta versao, autenticacao,
    Organizacao e Projeto (fundacao da plataforma, Task 001/Slice 001).
servers:
  - url: http://localhost:3000
    description: backend local (NestJS)
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      operationId: authLogin
      summary: Autentica um usuario e retorna um JWT
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Credenciais invalidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/me:
    get:
      operationId: authMe
      summary: Retorna o usuario autenticado
      tags: [auth]
      responses:
        "200":
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Nao autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /organizations:
    get:
      operationId: listOrganizations
      summary: Lista organizacoes vinculadas ao usuario autenticado
      tags: [organizations]
      responses:
        "200":
          description: Lista de organizacoes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createOrganization
      summary: Cria uma organizacao
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInput"
      responses:
        "201":
          description: Organizacao criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /organizations/{id}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      operationId: getOrganization
      summary: Obtem uma organizacao pelo id
      tags: [organizations]
      responses:
        "200":
          description: Organizacao encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateOrganization
      summary: Atualiza uma organizacao
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInput"
      responses:
        "200":
          description: Organizacao atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteOrganization
      summary: Remove (soft delete) uma organizacao
      tags: [organizations]
      responses:
        "204":
          description: Organizacao removida (soft delete)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects:
    get:
      operationId: listProjects
      summary: Lista projetos vinculados ao usuario autenticado
      tags: [projects]
      parameters:
        - name: organizationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lista de projetos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProject
      summary: Cria um projeto vinculado a uma organizacao
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Projeto criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /projects/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      summary: Obtem um projeto pelo id
      tags: [projects]
      responses:
        "200":
          description: Projeto encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      summary: Atualiza um projeto (inclui mudanca de status)
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "200":
          description: Projeto atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProject
      summary: Remove (soft delete) um projeto
      tags: [projects]
      responses:
        "204":
          description: Projeto removido (soft delete)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/modules:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: activateModule
      summary: >
        Ativa um modulo (ex.: Escopometro SGSI) no projeto. Idempotente: ativar um
        modulo ja ativo retorna a instancia existente (200) em vez de duplicar;
        a primeira ativacao cria (201) o ModuleInstance + SgsiScope + primeira
        SgsiScopeVersion (rascunho) + DocumentControl vazio.
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateModuleInput"
      responses:
        "200":
          description: Modulo ja estava ativo; retorna a instancia existente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SgsiScope"
        "201":
          description: Modulo ativado agora
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SgsiScope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getSgsiScope
      summary: Obtem o SgsiScope do projeto (modulo Escopometro), com o DocumentControl atual
      tags: [sgsi-scope]
      responses:
        "200":
          description: SgsiScope encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SgsiScope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Modulo Escopometro ainda nao foi ativado neste projeto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{id}/sgsi-scope/document-control:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    patch:
      operationId: updateDocumentControl
      summary: >
        Autosave da Etapa 1.2 (Controle documental). Todos os campos sao
        opcionais: persiste so o que foi enviado, sem exigir o payload
        completo (PRD secao 19).
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentControlInput"
      responses:
        "200":
          description: DocumentControl atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentControl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/context:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getContextSection
      summary: Obtem a secao Contexto (Etapa 2) do Escopometro do projeto
      tags: [sgsi-scope]
      responses:
        "200":
          description: Secao Contexto encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextSection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/context/history:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    patch:
      operationId: updateOrganizationContextHistory
      summary: >
        Autosave da Etapa 2.1 (Historico). Conteudo rico sanitizado no
        servidor (allowlist de tags, sem script/on*/javascript:, PRD secao 30)
        antes de persistir.
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationContextInput"
      responses:
        "200":
          description: Historico atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationContext"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/context/aspects:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createContextAspect
      summary: Cadastra uma questao externa ou interna (Etapa 2.3/2.4)
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextAspectInput"
      responses:
        "201":
          description: Questao criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextAspect"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/context/aspects/{aspectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: aspectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateContextAspect
      summary: Atualiza uma questao externa ou interna
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextAspectInput"
      responses:
        "200":
          description: Questao atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextAspect"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteContextAspect
      summary: Remove uma questao externa ou interna
      tags: [sgsi-scope]
      responses:
        "204":
          description: Questao removida
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/stakeholders:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listStakeholders
      summary: Lista as partes interessadas (Etapa 3.1) do projeto
      tags: [sgsi-scope]
      responses:
        "200":
          description: Lista de stakeholders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stakeholder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createStakeholder
      summary: Cadastra uma parte interessada
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StakeholderInput"
      responses:
        "201":
          description: Stakeholder criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stakeholder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/stakeholders/{stakeholderId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: stakeholderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateStakeholder
      summary: Atualiza uma parte interessada
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StakeholderInput"
      responses:
        "200":
          description: Stakeholder atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stakeholder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteStakeholder
      summary: Remove uma parte interessada
      tags: [sgsi-scope]
      responses:
        "204":
          description: Stakeholder removido
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /requirements:
    get:
      operationId: listRequirementsLibrary
      summary: Lista a biblioteca global de requisitos legais/regulatorios/contratuais
      tags: [requirements-library]
      responses:
        "200":
          description: Biblioteca de requisitos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Requirement"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createRequirementInLibrary
      summary: Adiciona um requisito a biblioteca global (DSR Admin)
      tags: [requirements-library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementInput"
      responses:
        "201":
          description: Requisito criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /requirements/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateRequirementInLibrary
      summary: Atualiza um requisito da biblioteca global (DSR Admin)
      tags: [requirements-library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementInput"
      responses:
        "200":
          description: Requisito atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteRequirementFromLibrary
      summary: Remove um requisito da biblioteca global (DSR Admin)
      tags: [requirements-library]
      responses:
        "204":
          description: Requisito removido
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/requirements:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectRequirements
      summary: >
        Retorna a biblioteca global de requisitos + os requisitos
        selecionados/customizados deste projeto (Etapa 3.2)
      tags: [sgsi-scope]
      responses:
        "200":
          description: Biblioteca + requisitos do projeto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRequirementsSection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createProjectRequirement
      summary: >
        Aplica um requisito da biblioteca (`requirementId`) ou customizado
        (`title`) a este projeto. Duplicar o mesmo requisito e permitido.
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectRequirementInput"
      responses:
        "201":
          description: Requisito aplicado ao projeto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRequirement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/requirements/{projectRequirementId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: projectRequirementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateProjectRequirement
      summary: Atualiza um requisito aplicado ao projeto
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectRequirementInput"
      responses:
        "200":
          description: Requisito atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRequirement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProjectRequirement
      summary: Remove um requisito aplicado ao projeto
      tags: [sgsi-scope]
      responses:
        "204":
          description: Requisito removido do projeto
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/governance:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getGovernanceSection
      summary: Obtem o comite CGSI e seus membros (Etapa 3.3)
      tags: [sgsi-scope]
      responses:
        "200":
          description: Comite + membros
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceSection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateGovernanceCommittee
      summary: Autosave dos dados do comite CGSI (cria o comite se ainda nao existir)
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceCommitteeInput"
      responses:
        "200":
          description: Comite atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceCommittee"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/governance/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createGovernanceMember
      summary: Adiciona um membro ao comite CGSI (cria o comite se ainda nao existir)
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceMemberInput"
      responses:
        "201":
          description: Membro criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/governance/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateGovernanceMember
      summary: Atualiza um membro do comite CGSI
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceMemberInput"
      responses:
        "200":
          description: Membro atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
