  /projects/{id}/sgsi-scope/limits/assets:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createScopeAsset
      summary: Cria um ativo tecnologico (Etapa 7.3, PRD secao 14.3)
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeAssetInput"
      responses:
        "201":
          description: Ativo criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeAsset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/limits/assets/{assetId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: assetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateScopeAsset
      summary: Atualiza um ativo tecnologico
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeAssetInput"
      responses:
        "200":
          description: Ativo atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeAsset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteScopeAsset
      summary: Remove um ativo tecnologico
      tags: [sgsi-scope]
      responses:
        "204":
          description: Ativo removido
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/limits/providers:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createScopeProvider
      summary: Cria um prestador de servico (Etapa 7.4, PRD secao 14.4)
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeProviderInput"
      responses:
        "201":
          description: Prestador criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeProvider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/limits/providers/{providerId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: providerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateScopeProvider
      summary: Atualiza um prestador de servico
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeProviderInput"
      responses:
        "200":
          description: Prestador atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteScopeProvider
      summary: Remove um prestador de servico
      tags: [sgsi-scope]
      responses:
        "204":
          description: Prestador removido
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/limits/approval:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    patch:
      operationId: updateScopeApproval
      summary: >
        Autosave do registro de aprovacao (Etapa 7.5, PRD secao 14.5).
        Responsavel/data ausentes sao permitidos no MVP (reduzem o percentual
        de preenchimento, nunca bloqueiam o salvamento).
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeApprovalInput"
      responses:
        "200":
          description: Aprovacao atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeApproval"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/limits/revisions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createScopeRevision
      summary: >
        Adiciona uma entrada ao historico de revisoes (Etapa 7.6, PRD secao
        14.6). Log de historico - sem update/delete.
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeRevisionInput"
      responses:
        "201":
          description: Revisao criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeRevision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/fill-percentage:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getFillPercentage
      summary: >
        Percentual de preenchimento do Escopometro (PRD secao 16). NUNCA
        representa conformidade, maturidade, qualidade, prontidao ou
        adequacao do escopo — so mede presenca de campos esperados nas
        etapas ja modeladas (1-4 nesta versao do contrato).
      tags: [sgsi-scope]
      responses:
        "200":
          description: Percentual calculado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FillPercentage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OrganizationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Payload invalido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Nao autenticado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Autenticado, mas sem vinculo com o recurso solicitado (organizacao/projeto)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Recurso nao encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: >
        Remocao bloqueada por integridade referencial (ex.: no de topologia ou
        componente de arquitetura ainda referenciado por um link/interface -
        Task 020, recomendacao do PRD e bloquear em vez de cascatear).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
        message:
          type: string
        error:
          type: string

    UserRole:
      type: string
      description: >
        Papel global do usuario. 'admin' corresponde a DSR Admin (PRD secao 3);
        'member' e o papel base sobre o qual o vinculo por organizacao/projeto
        (OrganizationMember/ProjectMember) define o papel de Consultor/Especialista.
      enum: [admin, member]

    User:
      type: object
      description: Reflete PublicUser (backend/src/modules/users), sem passwordHash.
      required: [id, name, email, role, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        role:
          $ref: "#/components/schemas/UserRole"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 64

    LoginResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
        user:
          $ref: "#/components/schemas/User"

    OrganizationMemberRole:
      type: string
      description: Papel do usuario dentro da organizacao (PRD secao 3, MVP).
      enum: [CONSULTANT]

    OrganizationInput:
      type: object
      description: Campos editaveis da Organizacao (PRD secao 5).
      required: [name]
      properties:
        name:
          type: string
          description: Razao social / nome
        segment:
          type: string
          nullable: true
        employeeCount:
          type: string
          nullable: true
          description: Numero aproximado de colaboradores (faixa ou valor livre)
        geographicScope:
          type: string
          nullable: true
        productsServices:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
          description: URL do logotipo (storage definitivo tratado na Task 026)
        institutionalHistory:
          type: string
          nullable: true
        business:
          type: string
          nullable: true
        mission:
          type: string
          nullable: true
        vision:
          type: string
          nullable: true
        values:
          type: array
          items:
            type: string

    Organization:
      allOf:
        - $ref: "#/components/schemas/OrganizationInput"
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            deletedAt:
              type: string
              format: date-time
              nullable: true

    ProjectStatus:
      type: string
      description: PRD secao 6.
      enum:
        [DRAFT, IN_PROGRESS, IN_REVIEW, WAITING_APPROVAL, APPROVED, ARCHIVED]

    ProjectInput:
      type: object
      description: Campos editaveis do Projeto (PRD secao 6).
      required: [name, organizationId, responsibleUserId]
      properties:
        name:
          type: string
        organizationId:
          type: string
          format: uuid
        description:
          type: string
          nullable: true
        responsibleUserId:
          type: string
          format: uuid
        participantUserIds:
          type: array
          items:
            type: string
            format: uuid
        startDate:
          type: string
          format: date
          nullable: true
        expectedEndDate:
          type: string
          format: date
          nullable: true
        status:
          $ref: "#/components/schemas/ProjectStatus"

    Project:
      allOf:
        - $ref: "#/components/schemas/ProjectInput"
        - type: object
          required: [id, status, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            deletedAt:
              type: string
              format: date-time
              nullable: true

    ModuleKey:
      type: string
      description: Modulos do DSR disponiveis para ativacao em um Projeto (PRD secao 2).
      enum: [SGSI_SCOPE]

    ModuleInstance:
      type: object
      description: >
        Representa a ativacao de um modulo dentro de um Projeto. Exposto via
        `POST /projects/{id}/modules` (Task 011) apenas embutido em `SgsiScope`,
        nao tem endpoint proprio de leitura ainda.
      required: [id, projectId, moduleKey, activatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        moduleKey:
          $ref: "#/components/schemas/ModuleKey"
        activatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true

    ActivateModuleInput:
      type: object
      required: [moduleKey]
      properties:
        moduleKey:
          $ref: "#/components/schemas/ModuleKey"

    SgsiScopeVersionStatus:
      type: string
      description: >
        PRD secao 20. So DRAFT/APPROVED nesta versao; protecao completa contra
        sobrescrita silenciosa de versao aprovada e a Task 027.
      enum: [DRAFT, APPROVED]

    DocumentControlInput:
      type: object
      description: >
        Etapa 1.2 do Escopometro (PRD secao 8.2). Todos os campos opcionais:
        usado tambem no autosave parcial (`PATCH .../document-control`).
      properties:
        classification:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        documentDate:
          type: string
          format: date
          nullable: true
        validUntil:
          type: string
          format: date
          nullable: true
        preparedByUserId:
          type: string
          format: uuid
          nullable: true
        approvedByUserId:
          type: string
          format: uuid
          nullable: true

    DocumentControl:
      allOf:
        - $ref: "#/components/schemas/DocumentControlInput"
        - type: object
          required: [id, sgsiScopeId, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            sgsiScopeId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    SgsiScope:
      type: object
      description: >
        Raiz do modulo Escopometro dentro de um Projeto (PRD secao 20). Uma
        SgsiScope por Projeto (1:1 com o ModuleInstance de moduleKey
        SGSI_SCOPE). Entidades das etapas 2-8 serao adicionadas a este schema
        pelas tasks correspondentes (Slices 002-006), nao de uma vez.
      required:
        [
          id,
          projectId,
          moduleInstanceId,
          currentVersionNumber,
          currentVersionStatus,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        moduleInstanceId:
          type: string
          format: uuid
        currentVersionNumber:
          type: integer
        currentVersionStatus:
          $ref: "#/components/schemas/SgsiScopeVersionStatus"
        documentControl:
          allOf:
            - $ref: "#/components/schemas/DocumentControl"
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true

    OrganizationContextInput:
      type: object
      description: >
        Etapa 2.1 (PRD secao 9.1). `historyHtml` e HTML de um editor de
        conteudo rico; o backend sanitiza (allowlist) antes de persistir.
      properties:
        historyHtml:
          type: string
          nullable: true

    OrganizationContext:
      type: object
      required: [id, sgsiScopeId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        sgsiScopeId:
          type: string
          format: uuid
        history:
          type: object
          nullable: true
          description: Envelope `{ html }` com o HTML ja sanitizado.
          properties:
            html:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ContextAspectType:
      type: string
      description: PRD secao 9.3 (EXTERNAL) / 9.4 (INTERNAL).
      enum: [EXTERNAL, INTERNAL]

    ContextAspectInput:
      type: object
      description: Etapa 2.3/2.4 (PRD secao 9.3/9.4).
      required: [type, title]
      properties:
        type:
          $ref: "#/components/schemas/ContextAspectType"
        title:
          type: string
        description:
          type: string
          nullable: true
        observations:
          type: string
          nullable: true

    ContextAspect:
      allOf:
        - $ref: "#/components/schemas/ContextAspectInput"
        - type: object
          required: [id, sgsiScopeId, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            sgsiScopeId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    ContextSection:
      type: object
      description: Resposta de `GET .../sgsi-scope/context` (historico + questoes).
      required: [organizationContext, aspects]
      properties:
        organizationContext:
          allOf:
            - $ref: "#/components/schemas/OrganizationContext"
          nullable: true
        aspects:
          type: array
          items:
            $ref: "#/components/schemas/ContextAspect"

    StakeholderInput:
      type: object
      description: Etapa 3.1 (PRD secao 10.1).
      required: [name]
      properties:
        name:
          type: string
        requirements:
          type: string
          nullable: true
        needs:
          type: string
          nullable: true
        expectations:
          type: string
          nullable: true
        observations:
          type: string
          nullable: true

    Stakeholder:
      allOf:
        - $ref: "#/components/schemas/StakeholderInput"
        - type: object
          required: [id, sgsiScopeId, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            sgsiScopeId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    RequirementCategory:
      type: string
      description: PRD secao 10.2.
      enum: [LEGAL, REGULATORY, CONTRACTUAL, OTHER]

    RequirementInput:
      type: object
      description: >
        Biblioteca global de requisitos (DSR Admin). Decisao confirmada com o
        usuario: uma biblioteca global seedada, nao uma copia por projeto.
      required: [title]
      properties:
        title:
          type: string
        category:
          $ref: "#/components/schemas/RequirementCategory"
        description:
          type: string
          nullable: true

    Requirement:
      allOf:
        - $ref: "#/components/schemas/RequirementInput"
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    ProjectRequirementInput:
      type: object
      description: >
        Ou `requirementId` (da biblioteca) ou `title` (customizado) deve ser
        informado. Duplicar o mesmo requisito no mesmo projeto e permitido.
      properties:
        requirementId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        category:
          $ref: "#/components/schemas/RequirementCategory"
        description:
          type: string
          nullable: true
        observations:
          type: string
          nullable: true

    ProjectRequirement:
      allOf:
        - $ref: "#/components/schemas/ProjectRequirementInput"
        - type: object
          required: [id, sgsiScopeId, title, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            sgsiScopeId:
              type: string
              format: uuid
            title:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    ProjectRequirementsSection:
      type: object
      description: Resposta de `GET .../sgsi-scope/requirements`.
      required: [library, selected]
      properties:
        library:
          type: array
          items:
            $ref: "#/components/schemas/Requirement"
        selected:
          type: array
          items:
            $ref: "#/components/schemas/ProjectRequirement"

    GovernanceCommitteeInput:
      type: object
      description: Etapa 3.3 - dados do comite CGSI (PRD secao 10.3).
      properties:
        name:
          type: string
          nullable: true
        objective:
          type: string
          nullable: true
        responsibilities:
          type: string
          nullable: true
        observations:
          type: string
          nullable: true

    GovernanceCommittee:
      allOf:
        - $ref: "#/components/schemas/GovernanceCommitteeInput"
        - type: object
          required: [id, sgsiScopeId, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            sgsiScopeId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    GovernanceMemberInput:
      type: object
      description: >
        Etapa 3.3 - membro do comite CGSI. `jobRole` ("funcao") e obrigatorio
        (membro sem funcao definida -> 400).
      required: [name, jobRole]
      properties:
        name:
          type: string
        jobRole:
          type: string
        area:
          type: string
          nullable: true
        committeeRole:
          type: string
          nullable: true
          description: "Papel no comite (ex.: Presidente, Secretario)."

    GovernanceMember:
      allOf:
        - $ref: "#/components/schemas/GovernanceMemberInput"
        - type: object
          required: [id, governanceCommitteeId, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            governanceCommitteeId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    GovernanceSection:
      type: object
      description: Resposta de `GET .../sgsi-scope/governance`.
      required: [committee, members]
      properties:
        committee:
          allOf:
            - $ref: "#/components/schemas/GovernanceCommittee"
          nullable: true
        members:
          type: array
          items:
            $ref: "#/components/schemas/GovernanceMember"

    ScopeDefinitionInput:
      type: object
      description: >
        Etapa 4.1-4.3 (PRD secao 11). `detailedDescriptionHtml` e HTML de um
        editor de conteudo rico, sanitizado no servidor antes de persistir
        (mesmo padrao de `OrganizationContext.history`, Task 012).
      properties:
        formalDeclaration:
          type: string
          nullable: true
          description: "11.1 - Declaracao formal do escopo."
        executiveJustification:
          type: string
          nullable: true
          description: "11.2 - Fundamentacao executiva."
        detailedDescriptionHtml:
          type: string
          nullable: true
          description: "11.3 - Descricao detalhada (editor de conteudo rico)."

    ScopeDefinition:
      type: object
      required: [id, sgsiScopeId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        sgsiScopeId:
          type: string
          format: uuid
        formalDeclaration:
          type: string
          nullable: true
        executiveJustification:
          type: string
          nullable: true
        detailedDescription:
          type: object
          nullable: true
          description: Envelope `{ html }` com o HTML ja sanitizado.
          properties:
            html:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ScopeListItemInput:
      type: object
      description: Usado por caracteristicas (4.4) e beneficios (4.5) do escopo.
      required: [description]
      properties:
        description:
          type: string

    ScopeListItem:
      allOf:
        - $ref: "#/components/schemas/ScopeListItemInput"
        - type: object
          required: [id, sgsiScopeId, createdAt]
          properties:
            id:
              type: string
              format: uuid
            sgsiScopeId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time

    ScopeDefinitionSection:
      type: object
      description: Resposta de `GET .../sgsi-scope/scope-definition`.
      required: [scopeDefinition, characteristics, benefits]
