openapi: 3.1.0
info:
  title: DRS API Contract
  version: 0.1.0
  description: >
    Contrato central para alinhamento entre next-js (front-end) e backend (NestJS)
    do DSR - Daryus Resilient Services. Cobre, nesta versao, autenticacao,
    Organizacao e Projeto (fundacao da plataforma, Task 001/Slice 001).
servers:
  - url: http://localhost:3000
    description: backend local (NestJS)
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      operationId: authLogin
      summary: Autentica um usuario e retorna um JWT
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Credenciais invalidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/me:
    get:
      operationId: authMe
      summary: Retorna o usuario autenticado
      tags: [auth]
      responses:
        "200":
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Nao autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /organizations:
    get:
      operationId: listOrganizations
      summary: Lista organizacoes vinculadas ao usuario autenticado
      tags: [organizations]
      responses:
        "200":
          description: Lista de organizacoes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createOrganization
      summary: Cria uma organizacao
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInput"
      responses:
        "201":
          description: Organizacao criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /organizations/{id}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      operationId: getOrganization
      summary: Obtem uma organizacao pelo id
      tags: [organizations]
      responses:
        "200":
          description: Organizacao encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateOrganization
      summary: Atualiza uma organizacao
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInput"
      responses:
        "200":
          description: Organizacao atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteOrganization
      summary: Remove (soft delete) uma organizacao
      tags: [organizations]
      responses:
        "204":
          description: Organizacao removida (soft delete)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects:
    get:
      operationId: listProjects
      summary: Lista projetos vinculados ao usuario autenticado
      tags: [projects]
      parameters:
        - name: organizationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lista de projetos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProject
      summary: Cria um projeto vinculado a uma organizacao
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Projeto criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /projects/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      summary: Obtem um projeto pelo id
      tags: [projects]
      responses:
        "200":
          description: Projeto encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      summary: Atualiza um projeto (inclui mudanca de status)
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "200":
          description: Projeto atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProject
      summary: Remove (soft delete) um projeto
      tags: [projects]
      responses:
        "204":
          description: Projeto removido (soft delete)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/modules:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: activateModule
      summary: >
        Ativa um modulo (ex.: Escopometro SGSI) no projeto. Idempotente: ativar um
        modulo ja ativo retorna a instancia existente (200) em vez de duplicar;
        a primeira ativacao cria (201) o ModuleInstance + SgsiScope + primeira
        SgsiScopeVersion (rascunho) + DocumentControl vazio.
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateModuleInput"
      responses:
        "200":
          description: Modulo ja estava ativo; retorna a instancia existente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SgsiScope"
        "201":
          description: Modulo ativado agora
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SgsiScope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getSgsiScope
      summary: Obtem o SgsiScope do projeto (modulo Escopometro), com o DocumentControl atual
      tags: [sgsi-scope]
      responses:
        "200":
          description: SgsiScope encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SgsiScope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Modulo Escopometro ainda nao foi ativado neste projeto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{id}/sgsi-scope/document-control:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    patch:
      operationId: updateDocumentControl
      summary: >
        Autosave da Etapa 1.2 (Controle documental). Todos os campos sao
        opcionais: persiste so o que foi enviado, sem exigir o payload
        completo (PRD secao 19).
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentControlInput"
      responses:
        "200":
          description: DocumentControl atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentControl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/context:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getContextSection
      summary: Obtem a secao Contexto (Etapa 2) do Escopometro do projeto
      tags: [sgsi-scope]
      responses:
        "200":
          description: Secao Contexto encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextSection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/context/history:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    patch:
      operationId: updateOrganizationContextHistory
      summary: >
        Autosave da Etapa 2.1 (Historico). Conteudo rico sanitizado no
        servidor (allowlist de tags, sem script/on*/javascript:, PRD secao 30)
        antes de persistir.
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationContextInput"
      responses:
        "200":
          description: Historico atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationContext"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/context/aspects:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createContextAspect
      summary: Cadastra uma questao externa ou interna (Etapa 2.3/2.4)
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextAspectInput"
      responses:
        "201":
          description: Questao criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextAspect"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/context/aspects/{aspectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: aspectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateContextAspect
      summary: Atualiza uma questao externa ou interna
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextAspectInput"
      responses:
        "200":
          description: Questao atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextAspect"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteContextAspect
      summary: Remove uma questao externa ou interna
      tags: [sgsi-scope]
      responses:
        "204":
          description: Questao removida
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/stakeholders:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listStakeholders
      summary: Lista as partes interessadas (Etapa 3.1) do projeto
      tags: [sgsi-scope]
      responses:
        "200":
          description: Lista de stakeholders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stakeholder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createStakeholder
      summary: Cadastra uma parte interessada
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StakeholderInput"
      responses:
        "201":
          description: Stakeholder criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stakeholder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/stakeholders/{stakeholderId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: stakeholderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateStakeholder
      summary: Atualiza uma parte interessada
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StakeholderInput"
      responses:
        "200":
          description: Stakeholder atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stakeholder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteStakeholder
      summary: Remove uma parte interessada
      tags: [sgsi-scope]
      responses:
        "204":
          description: Stakeholder removido
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /requirements:
    get:
      operationId: listRequirementsLibrary
      summary: Lista a biblioteca global de requisitos legais/regulatorios/contratuais
      tags: [requirements-library]
      responses:
        "200":
          description: Biblioteca de requisitos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Requirement"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createRequirementInLibrary
      summary: Adiciona um requisito a biblioteca global (DSR Admin)
      tags: [requirements-library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementInput"
      responses:
        "201":
          description: Requisito criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /requirements/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateRequirementInLibrary
      summary: Atualiza um requisito da biblioteca global (DSR Admin)
      tags: [requirements-library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementInput"
      responses:
        "200":
          description: Requisito atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteRequirementFromLibrary
      summary: Remove um requisito da biblioteca global (DSR Admin)
      tags: [requirements-library]
      responses:
        "204":
          description: Requisito removido
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/requirements:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectRequirements
      summary: >
        Retorna a biblioteca global de requisitos + os requisitos
        selecionados/customizados deste projeto (Etapa 3.2)
      tags: [sgsi-scope]
      responses:
        "200":
          description: Biblioteca + requisitos do projeto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRequirementsSection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createProjectRequirement
      summary: >
        Aplica um requisito da biblioteca (`requirementId`) ou customizado
        (`title`) a este projeto. Duplicar o mesmo requisito e permitido.
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectRequirementInput"
      responses:
        "201":
          description: Requisito aplicado ao projeto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRequirement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/requirements/{projectRequirementId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: projectRequirementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateProjectRequirement
      summary: Atualiza um requisito aplicado ao projeto
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectRequirementInput"
      responses:
        "200":
          description: Requisito atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRequirement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProjectRequirement
      summary: Remove um requisito aplicado ao projeto
      tags: [sgsi-scope]
      responses:
        "204":
          description: Requisito removido do projeto
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/governance:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getGovernanceSection
      summary: Obtem o comite CGSI e seus membros (Etapa 3.3)
      tags: [sgsi-scope]
      responses:
        "200":
          description: Comite + membros
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceSection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateGovernanceCommittee
      summary: Autosave dos dados do comite CGSI (cria o comite se ainda nao existir)
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceCommitteeInput"
      responses:
        "200":
          description: Comite atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceCommittee"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/governance/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createGovernanceMember
      summary: Adiciona um membro ao comite CGSI (cria o comite se ainda nao existir)
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceMemberInput"
      responses:
        "201":
          description: Membro criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/sgsi-scope/governance/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateGovernanceMember
      summary: Atualiza um membro do comite CGSI
      tags: [sgsi-scope]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceMemberInput"
      responses:
        "200":
          description: Membro atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteGovernanceMember
      summary: Remove um membro do comite CGSI
      tags: [sgsi-scope]
      responses:
        "204":
          description: Membro removido
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OrganizationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Payload invalido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Nao autenticado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Autenticado, mas sem vinculo com o recurso solicitado (organizacao/projeto)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Recurso nao encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
        message:
          type: string
        error:
          type: string

    UserRole:
      type: string
      description: >
        Papel global do usuario. 'admin' corresponde a DSR Admin (PRD secao 3);
        'member' e o papel base sobre o qual o vinculo por organizacao/projeto
        (OrganizationMember/ProjectMember) define o papel de Consultor/Especialista.
      enum: [admin, member]

    User:
      type: object
      description: Reflete PublicUser (backend/src/modules/users), sem passwordHash.
      required: [id, name, email, role, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        role:
          $ref: "#/components/schemas/UserRole"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 64

    LoginResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
        user:
          $ref: "#/components/schemas/User"

    OrganizationMemberRole:
      type: string
      description: Papel do usuario dentro da organizacao (PRD secao 3, MVP).
      enum: [CONSULTANT]

    OrganizationInput:
      type: object
      description: Campos editaveis da Organizacao (PRD secao 5).
      required: [name]
      properties:
        name:
          type: string
          description: Razao social / nome
        segment:
          type: string
          nullable: true
        employeeCount:
          type: string
          nullable: true
          description: Numero aproximado de colaboradores (faixa ou valor livre)
        geographicScope:
          type: string
          nullable: true
        productsServices:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
          description: URL do logotipo (storage definitivo tratado na Task 026)
        institutionalHistory:
          type: string
          nullable: true
        business:
          type: string
          nullable: true
        mission:
          type: string
          nullable: true
        vision:
          type: string
          nullable: true
        values:
          type: array
          items:
            type: string

    Organization:
      allOf:
        - $ref: "#/components/schemas/OrganizationInput"
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            deletedAt:
              type: string
              format: date-time
              nullable: true

    ProjectStatus:
      type: string
      description: PRD secao 6.
      enum:
        [DRAFT, IN_PROGRESS, IN_REVIEW, WAITING_APPROVAL, APPROVED, ARCHIVED]

    ProjectInput:
      type: object
      description: Campos editaveis do Projeto (PRD secao 6).
      required: [name, organizationId, responsibleUserId]
      properties:
        name:
          type: string
        organizationId:
          type: string
          format: uuid
        description:
          type: string
          nullable: true
        responsibleUserId:
          type: string
          format: uuid
        participantUserIds:
          type: array
          items:
            type: string
            format: uuid
        startDate:
          type: string
          format: date
          nullable: true
        expectedEndDate:
          type: string
          format: date
          nullable: true
        status:
          $ref: "#/components/schemas/ProjectStatus"

    Project:
      allOf:
        - $ref: "#/components/schemas/ProjectInput"
        - type: object
          required: [id, status, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            deletedAt:
              type: string
              format: date-time
              nullable: true

    ModuleKey:
      type: string
      description: Modulos do DSR disponiveis para ativacao em um Projeto (PRD secao 2).
      enum: [SGSI_SCOPE]

    ModuleInstance:
      type: object
      description: >
        Representa a ativacao de um modulo dentro de um Projeto. Exposto via
        `POST /projects/{id}/modules` (Task 011) apenas embutido em `SgsiScope`,
        nao tem endpoint proprio de leitura ainda.
      required: [id, projectId, moduleKey, activatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        moduleKey:
          $ref: "#/components/schemas/ModuleKey"
        activatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true

    ActivateModuleInput:
      type: object
      required: [moduleKey]
      properties:
        moduleKey:
          $ref: "#/components/schemas/ModuleKey"

    SgsiScopeVersionStatus:
      type: string
      description: >
        PRD secao 20. So DRAFT/APPROVED nesta versao; protecao completa contra
        sobrescrita silenciosa de versao aprovada e a Task 027.
      enum: [DRAFT, APPROVED]

    DocumentControlInput:
      type: object
      description: >
        Etapa 1.2 do Escopometro (PRD secao 8.2). Todos os campos opcionais:
        usado tambem no autosave parcial (`PATCH .../document-control`).
      properties:
        classification:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        documentDate:
          type: string
          format: date
          nullable: true
        validUntil:
          type: string
          format: date
          nullable: true
        preparedByUserId:
          type: string
          format: uuid
          nullable: true
        approvedByUserId:
          type: string
          format: uuid
          nullable: true

    DocumentControl:
      allOf:
        - $ref: "#/components/schemas/DocumentControlInput"
        - type: object
          required: [id, sgsiScopeId, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            sgsiScopeId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    SgsiScope:
      type: object
      description: >
        Raiz do modulo Escopometro dentro de um Projeto (PRD secao 20). Uma
        SgsiScope por Projeto (1:1 com o ModuleInstance de moduleKey
        SGSI_SCOPE). Entidades das etapas 2-8 serao adicionadas a este schema
        pelas tasks correspondentes (Slices 002-006), nao de uma vez.
      required:
        [
          id,
          projectId,
          moduleInstanceId,
          currentVersionNumber,
          currentVersionStatus,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        moduleInstanceId:
          type: string
          format: uuid
        currentVersionNumber:
          type: integer
        currentVersionStatus:
          $ref: "#/components/schemas/SgsiScopeVersionStatus"
        documentControl:
          allOf:
            - $ref: "#/components/schemas/DocumentControl"
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true

    OrganizationContextInput:
      type: object
      description: >
        Etapa 2.1 (PRD secao 9.1). `historyHtml` e HTML de um editor de
        conteudo rico; o backend sanitiza (allowlist) antes de persistir.
      properties:
        historyHtml:
          type: string
          nullable: true

    OrganizationContext:
      type: object
      required: [id, sgsiScopeId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        sgsiScopeId:
          type: string
          format: uuid
        history:
          type: object
          nullable: true
          description: Envelope `{ html }` com o HTML ja sanitizado.
          properties:
            html:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ContextAspectType:
      type: string
      description: PRD secao 9.3 (EXTERNAL) / 9.4 (INTERNAL).
      enum: [EXTERNAL, INTERNAL]

    ContextAspectInput:
      type: object
      description: Etapa 2.3/2.4 (PRD secao 9.3/9.4).
      required: [type, title]
      properties:
        type:
          $ref: "#/components/schemas/ContextAspectType"
        title:
          type: string
        description:
          type: string
          nullable: true
        observations:
          type: string
          nullable: true

    ContextAspect:
      allOf:
        - $ref: "#/components/schemas/ContextAspectInput"
        - type: object
          required: [id, sgsiScopeId, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            sgsiScopeId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    ContextSection:
      type: object
      description: Resposta de `GET .../sgsi-scope/context` (historico + questoes).
      required: [organizationContext, aspects]
      properties:
        organizationContext:
          allOf:
            - $ref: "#/components/schemas/OrganizationContext"
          nullable: true
        aspects:
          type: array
          items:
            $ref: "#/components/schemas/ContextAspect"

    StakeholderInput:
      type: object
      description: Etapa 3.1 (PRD secao 10.1).
      required: [name]
      properties:
        name:
          type: string
        requirements:
          type: string
          nullable: true
        needs:
          type: string
          nullable: true
        expectations:
          type: string
          nullable: true
        observations:
          type: string
          nullable: true

    Stakeholder:
      allOf:
        - $ref: "#/components/schemas/StakeholderInput"
        - type: object
          required: [id, sgsiScopeId, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            sgsiScopeId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    RequirementCategory:
      type: string
      description: PRD secao 10.2.
      enum: [LEGAL, REGULATORY, CONTRACTUAL, OTHER]

    RequirementInput:
      type: object
      description: >
        Biblioteca global de requisitos (DSR Admin). Decisao confirmada com o
        usuario: uma biblioteca global seedada, nao uma copia por projeto.
      required: [title]
      properties:
        title:
          type: string
        category:
          $ref: "#/components/schemas/RequirementCategory"
        description:
          type: string
          nullable: true

    Requirement:
      allOf:
        - $ref: "#/components/schemas/RequirementInput"
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    ProjectRequirementInput:
      type: object
      description: >
        Ou `requirementId` (da biblioteca) ou `title` (customizado) deve ser
        informado. Duplicar o mesmo requisito no mesmo projeto e permitido.
      properties:
        requirementId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        category:
          $ref: "#/components/schemas/RequirementCategory"
        description:
          type: string
          nullable: true
        observations:
          type: string
          nullable: true

    ProjectRequirement:
      allOf:
        - $ref: "#/components/schemas/ProjectRequirementInput"
        - type: object
          required: [id, sgsiScopeId, title, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            sgsiScopeId:
              type: string
              format: uuid
            title:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    ProjectRequirementsSection:
      type: object
      description: Resposta de `GET .../sgsi-scope/requirements`.
      required: [library, selected]
      properties:
        library:
          type: array
          items:
            $ref: "#/components/schemas/Requirement"
        selected:
          type: array
          items:
            $ref: "#/components/schemas/ProjectRequirement"

    GovernanceCommitteeInput:
      type: object
      description: Etapa 3.3 - dados do comite CGSI (PRD secao 10.3).
      properties:
        name:
          type: string
          nullable: true
        objective:
          type: string
          nullable: true
        responsibilities:
          type: string
          nullable: true
        observations:
          type: string
          nullable: true

    GovernanceCommittee:
      allOf:
        - $ref: "#/components/schemas/GovernanceCommitteeInput"
        - type: object
          required: [id, sgsiScopeId, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            sgsiScopeId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    GovernanceMemberInput:
      type: object
      description: >
        Etapa 3.3 - membro do comite CGSI. `jobRole` ("funcao") e obrigatorio
        (membro sem funcao definida -> 400).
      required: [name, jobRole]
      properties:
        name:
          type: string
        jobRole:
          type: string
        area:
          type: string
          nullable: true
        committeeRole:
          type: string
          nullable: true
          description: "Papel no comite (ex.: Presidente, Secretario)."

    GovernanceMember:
      allOf:
        - $ref: "#/components/schemas/GovernanceMemberInput"
        - type: object
          required: [id, governanceCommitteeId, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            governanceCommitteeId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    GovernanceSection:
      type: object
      description: Resposta de `GET .../sgsi-scope/governance`.
      required: [committee, members]
      properties:
        committee:
          allOf:
            - $ref: "#/components/schemas/GovernanceCommittee"
          nullable: true
        members:
          type: array
          items:
            $ref: "#/components/schemas/GovernanceMember"

    AuditAction:
      type: string
      description: PRD secao 21.
      enum:
        - CREATE
        - UPDATE
        - DELETE
        - STATUS_CHANGE
        - DOCUMENT_GENERATED
        - SUBMITTED_FOR_REVIEW
        - APPROVED

    AuditLog:
      type: object
      description: >
        Conceitual nesta versao do contrato (sem endpoint proprio ainda - ver Task 027).
      required:
        [id, organizationId, userId, entity, entityId, action, timestamp]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
          nullable: true
        userId:
          type: string
          format: uuid
        entity:
          type: string
        entityId:
          type: string
          format: uuid
        action:
          $ref: "#/components/schemas/AuditAction"
        timestamp:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
          nullable: true
