      type: string
      description: PRD secao 21.
      enum:
        - CREATE
        - UPDATE
        - DELETE
        - STATUS_CHANGE
        - DOCUMENT_GENERATED
        - SUBMITTED_FOR_REVIEW
        - APPROVED

    AuditLog:
      type: object
      description: >
